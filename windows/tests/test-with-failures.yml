name: Test JUnit results with test failures
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: ./action/bash
        continue-on-error: true
        with:
          files: tests/fixtures/junit-with-failures.xml
          check_run: 'false'
          job_summary: 'false'
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
          json_file: /tmp/test-results-failures.json
          fail_on: 'nothing'
          action_fail: 'false'

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUTPUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with json output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert JSON output contains failure info when action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "json: $JSON_OUTPUT"
            # The JSON output should contain failure count info
            if ! echo "$JSON_OUTPUT" | grep -q '"tests"'; then
              echo "FAIL: JSON output does not contain 'tests' key"
              exit 1
            fi
            echo "PASS: JSON output contains test result data"
          else
            echo "SKIP: action did not succeed, skipping JSON content check"
          fi
