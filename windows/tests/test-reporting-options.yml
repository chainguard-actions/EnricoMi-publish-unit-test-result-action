name: Test reporting and context options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Windows variant of the action: under act on Linux a failure outcome is
      # tolerated, but a success must produce valid json results.
      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/junit/failing.xml
          commit: ${{ github.sha }}
          comment_title: 'Custom Test Results Title'
          check_run_annotations_branch: '*'
          deduplicate_classes_by_file_name: 'true'
          event_file: tests/fixtures/event-push.json
          event_name: push
          large_files: 'true'
          report_individual_runs: 'true'
          secondary_rate_limit_wait_seconds: '1'
          test_changes_limit: '5'
          test_file_prefix: '+src/'
          check_run: 'false'
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
          github_retries: '0'
          action_fail: 'false'
      - name: Assert results
        env:
          RESULT: ${{ steps.action.outputs.json }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            if ! echo "$RESULT" | grep -q '"failure"'; then
              echo "FAIL: expected failure conclusion for failing tests"
              exit 1
            fi
            echo "PASS: got json results"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Windows action / sentinel repo under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
