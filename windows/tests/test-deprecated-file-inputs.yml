name: Test deprecated file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Windows variant of the action: under act on Linux a failure outcome is
      # tolerated, but a success must produce valid json results.
      - id: action
        uses: .
        continue-on-error: true
        with:
          junit_files: tests/fixtures/junit/passing.xml
          nunit_files: tests/fixtures/nunit/does-not-exist-*.xml
          xunit_files: tests/fixtures/xunit/does-not-exist-*.xml
          trx_files: tests/fixtures/trx/does-not-exist-*.trx
          github_token_actor: github-actions
          check_run: 'false'
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
          github_retries: '0'
      - name: Assert results
        env:
          RESULT: ${{ steps.action.outputs.json }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            if ! echo "$RESULT" | grep -q '"conclusion"'; then
              echo "FAIL: json output lacks conclusion"
              exit 1
            fi
            echo "PASS: got json results"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Windows action / sentinel repo under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
