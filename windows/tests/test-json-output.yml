name: Test JSON output with test results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: ./action/bash
        continue-on-error: true
        with:
          files: tests/fixtures/junit-passing.xml
          check_run: 'false'
          job_summary: 'false'
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
          json_file: /tmp/json-output-test.json
          json_suite_details: 'true'
          json_test_case_results: 'true'
          fail_on: 'nothing'
          action_fail: 'false'

      - name: Assert JSON output is valid when action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "json output: $JSON_OUTPUT"
            if [ -z "$JSON_OUTPUT" ]; then
              echo "FAIL: json output is empty"
              exit 1
            fi
            # Verify JSON output contains expected keys
            if ! echo "$JSON_OUTPUT" | grep -q '"tests"'; then
              echo "FAIL: json output missing 'tests' key"
              exit 1
            fi
            if ! echo "$JSON_OUTPUT" | grep -q '"runs"'; then
              echo "FAIL: json output missing 'runs' key"
              exit 1
            fi
            echo "PASS: json output contains expected structure"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert JSON file contains suite details when action succeeded
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -f /tmp/json-output-test.json ]; then
              echo "FAIL: JSON file not found"
              exit 1
            fi
            echo "JSON file contents:"
            cat /tmp/json-output-test.json
            # Verify the JSON file is valid JSON with test data
            if ! python3 -c "import json,sys; data=json.load(open('/tmp/json-output-test.json')); assert 'tests' in data, 'missing tests key'" 2>/dev/null; then
              echo "FAIL: JSON file is not valid or missing 'tests' key"
              exit 1
            fi
            echo "PASS: JSON file is valid with expected structure"
          else
            echo "SKIP: action did not succeed, skipping JSON file check"
          fi
