name: Test JSON file output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture JUnit file to workspace
        run: |
          cp tests/fixtures/junit-passing.xml junit-results-json.xml

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: junit-results-json.xml
          check_name: 'Test Results - JSON Output'
          comment_mode: 'off'
          check_run: 'false'
          job_summary: 'false'
          compare_to_earlier_commit: 'false'
          fail_on: 'nothing'
          action_fail: 'false'
          json_file: 'test-results-output.json'
          json_suite_details: 'true'
          json_test_case_results: 'true'

      - name: Assert action ran and JSON file was created (or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            if [ ! -f "test-results-output.json" ]; then
              echo "FAIL: json_file was not created"
              exit 1
            fi
            echo "JSON file contents:"
            cat test-results-output.json
            echo "PASS: action succeeded with json output and json file created"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
