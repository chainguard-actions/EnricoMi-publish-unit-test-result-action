name: Test advanced options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up PowerShell (ensure pwsh is available)
        run: |
          which pwsh || (apt-get update -qq && apt-get install -y -qq powershell)

      - name: Set up Python3
        run: |
          python3 --version || (apt-get update -qq && apt-get install -y -qq python3 python3-pip)

      - name: Copy fixture test results and create event file
        run: |
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/junit-passing.xml" "$GITHUB_WORKSPACE/junit-results.xml"
          # Create a minimal event file for event_file input
          cat > "$GITHUB_WORKSPACE/event.json" <<'EOF'
          {"action": "push", "ref": "refs/heads/main"}
          EOF

      - name: Get current commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: junit-results.xml
          check_name: Test Results (Advanced Options)
          comment_mode: "off"
          commit: ${{ steps.sha.outputs.sha }}
          event_file: "${{ github.workspace }}/event.json"
          event_name: "push"
          report_individual_runs: "true"
          deduplicate_classes_by_file_name: "false"
          large_files: "false"
          test_file_prefix: ""
          secondary_rate_limit_wait_seconds: "60"
          check_run: "true"
          job_summary: "true"
          fail_on: "nothing"
          action_fail: "false"

      - name: Assert action ran (outputs set, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUTPUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with JSON output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
