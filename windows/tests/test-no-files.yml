name: Test with no test result files (inconclusive)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up PowerShell (ensure pwsh is available)
        run: |
          which pwsh || (apt-get update -qq && apt-get install -y -qq powershell)

      - name: Set up Python3
        run: |
          python3 --version || (apt-get update -qq && apt-get install -y -qq python3 python3-pip)

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: "nonexistent-test-results/*.xml"
          check_name: Test Results (No Files)
          comment_mode: "off"
          check_run: "true"
          job_summary: "true"
          fail_on: "nothing"
          action_fail: "false"
          action_fail_on_inconclusive: "false"

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (no test files is a valid inconclusive result)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or no files error)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
