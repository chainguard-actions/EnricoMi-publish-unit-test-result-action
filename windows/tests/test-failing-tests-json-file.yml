name: Test failing results written to json_file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Windows variant of the action: under act on Linux a failure outcome is
      # tolerated, but a success must produce a valid json_file.
      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/junit/failing.xml
          check_run: 'false'
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
          github_retries: '0'
          json_file: test-results.json
          action_fail: 'false'
      - name: Assert results
        env:
          RESULT: ${{ steps.action.outputs.json }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -s test-results.json ]; then
              echo "FAIL: json_file test-results.json not written"
              exit 1
            fi
            cat test-results.json
            if ! grep -q '"failure"' test-results.json; then
              echo "FAIL: expected failure conclusion in json_file"
              exit 1
            fi
            echo "PASS: json_file written with failure conclusion"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Windows action / sentinel repo under act)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
