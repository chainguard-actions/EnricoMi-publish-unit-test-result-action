name: Test event_file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture JUnit file and create event file
        run: |
          cp tests/fixtures/junit-passing.xml junit-results-event-file.xml
          # Create a minimal push event file
          cat > push-event.json << 'EOF'
          {
            "action": "push",
            "ref": "refs/heads/main",
            "repository": {
              "default_branch": "main"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: junit-results-event-file.xml
          check_name: 'Test Results - Event File'
          comment_mode: 'off'
          check_run: 'false'
          job_summary: 'false'
          compare_to_earlier_commit: 'false'
          fail_on: 'nothing'
          action_fail: 'false'
          event_file: 'push-event.json'
          event_name: 'push'

      - name: Assert action ran or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with json output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
