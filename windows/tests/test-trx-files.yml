name: Test trx_files deprecated input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture TRX file to workspace
        run: |
          cp tests/fixtures/trx-passing.trx trx-results.trx

      - id: action
        uses: .
        continue-on-error: true
        with:
          trx_files: trx-results.trx
          check_name: 'Test Results - TRX Files'
          comment_mode: 'off'
          check_run: 'false'
          job_summary: 'true'
          compare_to_earlier_commit: 'false'
          fail_on: 'nothing'
          action_fail: 'false'

      - name: Assert action ran or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with json output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
