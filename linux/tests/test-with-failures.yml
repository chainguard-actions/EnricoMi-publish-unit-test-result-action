name: Test with failing test results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture test results with failures
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/junit-with-failures.xml" "$GITHUB_WORKSPACE/junit-failures.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: junit-failures.xml
          check_name: Test Results With Failures
          check_run: 'false'
          job_summary: 'false'
          comment_mode: 'off'
          fail_on: 'test failures'
          action_fail: 'true'
          action_fail_on_inconclusive: 'false'
          compare_to_earlier_commit: 'false'

      - name: Assert action reported failures
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          # With action_fail=true and test failures present, the action should fail
          # OR it may fail due to sentinel repo API calls
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (test failures or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            # If it succeeded (e.g. check_run=false bypassed API), verify JSON shows failures
            if [ -n "$JSON_OUT" ]; then
              if echo "$JSON_OUT" | grep -q '"failure"'; then
                echo "PASS: action succeeded and JSON shows failures"
              else
                echo "PASS: action succeeded with JSON output"
              fi
            else
              echo "PASS: action succeeded (check_run disabled, no API call needed)"
            fi
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
