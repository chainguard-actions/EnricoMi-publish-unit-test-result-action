name: Test basic usage with passing tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture test results into workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/junit-passing.xml" "$GITHUB_WORKSPACE/junit-results.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: junit-results.xml
          check_name: 'Test Results - Basic'
          comment_mode: 'off'
          check_run: 'true'
          job_summary: 'true'
          fail_on: 'test failures'
          action_fail: 'false'
          compare_to_earlier_commit: 'false'
          json_file: test-results-output.json

      - name: Assert action ran and produced output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUTPUT"

          if [ "$OUTCOME" = "success" ]; then
            # Action succeeded - validate JSON output
            if [ -z "$JSON_OUTPUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            # Check that the JSON output contains expected test counts
            echo "$JSON_OUTPUT" | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read())
          stats = data.get('stats', {})
          tests = stats.get('tests', 0)
          print(f'tests found: {tests}')
          if tests < 1:
              print('FAIL: expected at least 1 test in results')
              sys.exit(1)
          print('PASS: JSON output contains test results')
          "
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
