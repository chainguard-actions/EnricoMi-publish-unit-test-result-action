name: Test with failing test results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture test results into workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/junit-failing.xml" "$GITHUB_WORKSPACE/junit-failing-results.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: junit-failing-results.xml
          check_name: 'Test Results - Failing'
          comment_mode: 'off'
          check_run: 'true'
          job_summary: 'true'
          fail_on: 'test failures'
          action_fail: 'false'
          compare_to_earlier_commit: 'false'

      - name: Assert action ran and reported failures in output
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUTPUT"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUTPUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            # Verify the JSON output reflects the failure count
            echo "$JSON_OUTPUT" | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read())
          stats = data.get('stats', {})
          tests = stats.get('tests', 0)
          failures = stats.get('tests_fail', 0)
          print(f'tests: {tests}, failures: {failures}')
          if tests < 1:
              print('FAIL: expected at least 1 test in results')
              sys.exit(1)
          if failures < 1:
              print('FAIL: expected at least 1 failure in results')
              sys.exit(1)
          print('PASS: JSON output correctly reflects test failures')
          "
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
