name: Test deprecated file inputs and extra options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture test results into workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/junit-passing.xml" "$GITHUB_WORKSPACE/junit-results.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          junit_files: junit-results.xml
          check_name: 'Test Results - Deprecated Inputs'
          comment_title: 'My Custom Comment Title'
          comment_mode: 'off'
          check_run: 'false'
          job_summary: 'true'
          fail_on: 'nothing'
          action_fail: 'false'
          compare_to_earlier_commit: 'false'
          report_individual_runs: 'true'
          test_file_prefix: '+src/'
          test_changes_limit: '5'
          check_run_annotations_branch: 'main, master'
          secondary_rate_limit_wait_seconds: '60'
          github_token_actor: 'github-actions[bot]'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUTPUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "$JSON_OUTPUT" | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read())
          stats = data.get('stats', {})
          tests = stats.get('tests', 0)
          print(f'tests found: {tests}')
          if tests < 1:
              print('FAIL: expected at least 1 test in results')
              sys.exit(1)
          print('PASS: JSON output contains test results')
          "
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
