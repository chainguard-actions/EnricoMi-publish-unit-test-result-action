name: Test deprecated file inputs and related options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture test results
        run: |
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/junit-passing.xml" "$GITHUB_WORKSPACE/junit-deprecated.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          junit_files: junit-deprecated.xml
          nunit_files: ''
          xunit_files: ''
          trx_files: ''
          check_name: Test Results Deprecated Inputs
          check_run: 'false'
          job_summary: 'false'
          comment_mode: 'off'
          fail_on: 'nothing'
          action_fail: 'false'
          action_fail_on_inconclusive: 'false'
          compare_to_earlier_commit: 'false'
          large_files: 'false'
          report_individual_runs: 'true'
          deduplicate_classes_by_file_name: 'false'
          test_file_prefix: ''
          github_token_actor: ''
          secondary_rate_limit_wait_seconds: '60'
          test_changes_limit: '10'

      - name: Assert action ran with deprecated inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            if ! echo "$JSON_OUT" | grep -q '"tests"'; then
              echo "FAIL: JSON output does not contain 'tests' field"
              exit 1
            fi
            echo "PASS: action succeeded with deprecated file inputs"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
