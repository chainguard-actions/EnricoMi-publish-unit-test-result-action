name: Test NUnit and XUnit file inputs with large_files and deduplication
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture test results into workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/nunit-passing.xml" "$GITHUB_WORKSPACE/nunit-results.xml"
          cp "$GITHUB_WORKSPACE/tests/fixtures/xunit-passing.xml" "$GITHUB_WORKSPACE/xunit-results.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          nunit_files: nunit-results.xml
          xunit_files: xunit-results.xml
          check_name: 'Test Results - NUnit XUnit'
          comment_mode: 'off'
          check_run: 'false'
          job_summary: 'true'
          fail_on: 'nothing'
          action_fail: 'false'
          compare_to_earlier_commit: 'false'
          large_files: 'false'
          deduplicate_classes_by_file_name: 'false'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUTPUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "$JSON_OUTPUT" | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read())
          stats = data.get('stats', {})
          tests = stats.get('tests', 0)
          print(f'tests found: {tests}')
          if tests < 1:
              print('FAIL: expected at least 1 test in results')
              sys.exit(1)
          print('PASS: JSON output contains test results')
          "
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
