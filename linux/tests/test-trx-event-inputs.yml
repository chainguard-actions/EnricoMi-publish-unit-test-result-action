name: Test TRX file input with event and commit inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture test results into workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/trx-passing.trx" "$GITHUB_WORKSPACE/trx-results.trx"
          # Create a minimal event file for testing event_file input
          cat > "$GITHUB_WORKSPACE/event.json" <<'EOF'
          {
            "action": "push",
            "ref": "refs/heads/main"
          }
          EOF

      - name: Get current commit SHA
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          trx_files: trx-results.trx
          check_name: 'Test Results - TRX Event'
          comment_mode: 'off'
          check_run: 'false'
          job_summary: 'true'
          fail_on: 'nothing'
          action_fail: 'false'
          compare_to_earlier_commit: 'false'
          commit: ${{ steps.sha.outputs.sha }}
          event_file: event.json
          event_name: 'push'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUTPUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "$JSON_OUTPUT" | python3 -c "
          import sys, json
          data = json.loads(sys.stdin.read())
          stats = data.get('stats', {})
          tests = stats.get('tests', 0)
          print(f'tests found: {tests}')
          if tests < 1:
              print('FAIL: expected at least 1 test in results')
              sys.exit(1)
          print('PASS: JSON output contains test results')
          "
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
