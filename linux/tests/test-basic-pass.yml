name: Test basic passing JUnit results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify fixture present
        run: test -f tests/fixtures/junit-pass.xml
      # The action publishes to the repo from GITHUB_REPOSITORY, which is a
      # harness sentinel that 404s on the GitHub API, so failure is tolerated.
      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/junit-pass.xml
          check_run: 'false'
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
          job_summary: 'true'
          json_file: results-pass.json
      - name: Assert results
        env:
          RESULT: ${{ steps.action.outputs.json }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            printf '%s' "$RESULT" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          s = d["stats"]
          print("conclusion:", d.get("conclusion"), "stats:", s)
          assert d.get("conclusion") == "success", "expected conclusion success"
          assert s["tests"] == 3, "expected 3 tests"
          assert s["tests_succ"] == 3, "expected 3 passing tests"
          assert s["tests_fail"] == 0, "expected 0 failures"
          '
            if [ ! -s results-pass.json ]; then
              echo "FAIL: json_file results-pass.json not written"
              exit 1
            fi
            echo "PASS: results parsed correctly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
