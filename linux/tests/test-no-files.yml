name: Test with no matching test files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: nonexistent-test-results/*.xml
          check_name: 'Test Results - No Files'
          comment_mode: 'off'
          check_run: 'false'
          job_summary: 'true'
          fail_on: 'nothing'
          action_fail: 'false'
          action_fail_on_inconclusive: 'false'
          compare_to_earlier_commit: 'false'

      - name: Assert action handled missing files gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUTPUT"

          # When no files are found, the action should either:
          # - succeed with empty/zero results (action_fail_on_inconclusive=false)
          # - fail gracefully due to sentinel repo API issues
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with no test files (inconclusive result handled gracefully)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no test files found or sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
