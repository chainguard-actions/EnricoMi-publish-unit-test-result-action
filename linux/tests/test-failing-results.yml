name: Test failing JUnit results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify fixture present
        run: test -f tests/fixtures/junit-fail.xml
      # Sentinel GITHUB_REPOSITORY may make API calls 404; failure tolerated.
      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/junit-fail.xml
          check_run: 'false'
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
          action_fail: 'false'
      - name: Assert results
        env:
          RESULT: ${{ steps.action.outputs.json }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            printf '%s' "$RESULT" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          s = d["stats"]
          print("conclusion:", d.get("conclusion"), "stats:", s)
          assert d.get("conclusion") == "failure", "expected conclusion failure"
          assert s["tests"] == 3, "expected 3 tests"
          assert s["tests_succ"] == 1, "expected 1 passing test"
          assert s["tests_fail"] == 1, "expected 1 failure"
          assert s["tests_skip"] == 1, "expected 1 skipped"
          '
            echo "PASS: failing results parsed correctly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
