name: Test no matching result files (inconclusive)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Sentinel GITHUB_REPOSITORY may make API calls 404; failure tolerated.
      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/does-not-exist-*.xml
          check_run: 'false'
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
      - name: Assert results
        env:
          RESULT: ${{ steps.action.outputs.json }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            printf '%s' "$RESULT" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          s = d["stats"]
          print("conclusion:", d.get("conclusion"), "stats:", s)
          assert s["files"] == 0, "expected 0 files"
          assert s["tests"] == 0, "expected 0 tests"
          '
            echo "PASS: no files handled"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
