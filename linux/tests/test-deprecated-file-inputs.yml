name: Test deprecated file input options (junit_files, nunit_files, xunit_files, trx_files)
on:
  workflow_dispatch:
jobs:
  test-junit-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture test results
        run: |
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/junit-passing.xml" "$GITHUB_WORKSPACE/junit-results.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          junit_files: junit-results.xml
          github_token_actor: ''
          check_name: Test Results JUnit Files
          check_run: 'false'
          job_summary: 'false'
          comment_mode: 'off'
          fail_on: 'nothing'
          action_fail: 'false'
          action_fail_on_inconclusive: 'false'
          compare_to_earlier_commit: 'false'

      - name: Assert action ran (junit_files input)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with junit_files input"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

