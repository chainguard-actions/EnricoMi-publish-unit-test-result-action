name: Test deprecated file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      # Publishing targets the sentinel GITHUB_REPOSITORY, which 404s; tolerate failure.
      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token_actor: 'github-actions'
          junit_files: tests/fixtures/junit-pass.xml
          nunit_files: tests/fixtures/does-not-exist-nunit*.xml
          xunit_files: tests/fixtures/does-not-exist-xunit*.xml
          trx_files: tests/fixtures/does-not-exist*.trx
          check_run: 'false'
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
      - name: Assert results
        env:
          RESULT: ${{ steps.action.outputs.json }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            printf '%s' "$RESULT" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          s = d["stats"]
          print("conclusion:", d.get("conclusion"), "stats:", s)
          assert s["tests"] == 3, "expected 3 tests"
          assert s["tests_succ"] == 3, "expected 3 passing tests"
          '
            echo "PASS: results parsed correctly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
