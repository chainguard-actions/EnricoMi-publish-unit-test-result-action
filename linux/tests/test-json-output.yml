name: Test JSON output with test results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture test results
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/junit-passing.xml" "$GITHUB_WORKSPACE/junit-results.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: junit-results.xml
          check_name: Test Results JSON
          check_run: 'false'
          job_summary: 'false'
          comment_mode: 'off'
          fail_on: 'nothing'
          action_fail: 'false'
          action_fail_on_inconclusive: 'false'
          compare_to_earlier_commit: 'false'
          json_file: test-results.json
          json_suite_details: 'true'
          json_test_case_results: 'true'

      - name: Assert JSON output contains expected fields
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            # Verify JSON contains expected fields
            for field in '"tests"' '"runs"' '"commit"'; do
              if ! echo "$JSON_OUT" | grep -q "$field"; then
                echo "FAIL: JSON output does not contain field $field"
                exit 1
              fi
            done
            echo "PASS: JSON output contains expected fields"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert JSON file was written
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -f "$GITHUB_WORKSPACE/test-results.json" ]; then
              echo "FAIL: json_file was not created"
              exit 1
            fi
            echo "PASS: json_file exists"
            cat "$GITHUB_WORKSPACE/test-results.json"
          else
            echo "SKIP: action did not succeed (sentinel repo), skipping file check"
          fi
