name: Test JSON output file
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture test results
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/junit-passing.xml" "$GITHUB_WORKSPACE/test-results.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: test-results.xml
          check_name: Test Results JSON
          comment_mode: "off"
          check_run: "false"
          job_summary: "false"
          fail_on: "nothing"
          action_fail: "false"
          compare_to_earlier_commit: "false"
          json_file: test-results-output.json

      - name: Assert action ran and JSON file was written
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output (truncated): ${JSON_OUTPUT:0:200}"

          if [ "$OUTCOME" = "success" ]; then
            # Check that the JSON output contains test counts
            if [ -z "$JSON_OUTPUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            # Check that the JSON file was written
            if [ ! -f "$GITHUB_WORKSPACE/test-results-output.json" ]; then
              echo "FAIL: json_file was not created"
              exit 1
            fi
            echo "JSON file contents:"
            cat "$GITHUB_WORKSPACE/test-results-output.json"
            echo "PASS: action succeeded with json output and json file"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
