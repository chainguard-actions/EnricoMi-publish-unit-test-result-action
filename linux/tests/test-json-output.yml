name: Test JSON file output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture test results into workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/junit-passing.xml" "$GITHUB_WORKSPACE/junit-results.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: junit-results.xml
          check_name: 'Test Results - JSON Output'
          comment_mode: 'off'
          check_run: 'false'
          job_summary: 'true'
          fail_on: 'nothing'
          action_fail: 'false'
          compare_to_earlier_commit: 'false'
          json_file: test-output.json
          json_suite_details: 'true'
          json_test_case_results: 'true'

      - name: Assert JSON file was written and contains expected data
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"

          if [ "$OUTCOME" = "success" ]; then
            # Check the JSON output step variable
            if [ -z "$JSON_OUTPUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi

            # Check the JSON file was written
            if [ ! -f "$GITHUB_WORKSPACE/test-output.json" ]; then
              echo "FAIL: expected JSON output file not found at test-output.json"
              exit 1
            fi

            echo "JSON file contents:"
            cat "$GITHUB_WORKSPACE/test-output.json"

            # Validate the JSON file is valid JSON and has expected structure
            python3 -c "
          import sys, json
          with open('$GITHUB_WORKSPACE/test-output.json') as f:
              data = json.load(f)
          stats = data.get('stats', {})
          tests = stats.get('tests', 0)
          print(f'tests found in JSON file: {tests}')
          if tests < 1:
              print('FAIL: expected at least 1 test in JSON file')
              sys.exit(1)
          print('PASS: JSON file contains valid test results')
          "
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
