name: Test advanced options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Get HEAD sha
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      # Publishing targets the sentinel GITHUB_REPOSITORY, which 404s; tolerate failure.
      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/junit-fail.xml
          commit: ${{ steps.sha.outputs.sha }}
          check_name: 'Advanced Results'
          comment_title: 'Advanced Comment Title'
          check_run: 'false'
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
          check_run_annotations_branch: '*'
          deduplicate_classes_by_file_name: 'true'
          event_file: tests/fixtures/event-push.json
          event_name: push
          large_files: 'true'
          report_individual_runs: 'true'
          secondary_rate_limit_wait_seconds: '5'
          test_changes_limit: '5'
          test_file_prefix: '+src/'
          json_file: results-advanced.json
      - name: Assert results
        env:
          RESULT: ${{ steps.action.outputs.json }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            printf '%s' "$RESULT" | python3 -c '
          import json, sys
          d = json.load(sys.stdin)
          s = d["stats"]
          print("conclusion:", d.get("conclusion"), "stats:", s)
          assert s["tests"] > 0, "expected tests"
          assert s["tests_fail"] + s.get("tests_error", 0) > 0, "expected failures"
          '
            echo "PASS: results parsed correctly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
