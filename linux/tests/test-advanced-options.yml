name: Test advanced options (comment_title, commit, test_changes_limit, test_file_prefix, report_individual_runs, secondary_rate_limit_wait_seconds)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture test results
        run: |
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/junit-passing.xml" "$GITHUB_WORKSPACE/test-results-advanced.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: test-results-advanced.xml
          check_name: Test Results Advanced Options
          comment_title: "My Custom Comment Title"
          comment_mode: "off"
          check_run: "false"
          job_summary: "false"
          fail_on: "nothing"
          action_fail: "false"
          compare_to_earlier_commit: "false"
          test_changes_limit: "5"
          test_file_prefix: "+src/"
          report_individual_runs: "true"
          secondary_rate_limit_wait_seconds: "30"
          commit: ${{ github.sha }}

      - name: Assert action ran (outputs set, or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output (truncated): ${JSON_OUTPUT:0:200}"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUTPUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with json output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
