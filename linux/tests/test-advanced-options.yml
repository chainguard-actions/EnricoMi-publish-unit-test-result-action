name: Test advanced options (comment_title, test_changes_limit, annotations branch, dedup, large_files, rate limits)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture test results
        run: |
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/junit-passing.xml" "$GITHUB_WORKSPACE/junit-results.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: junit-results.xml
          check_name: Test Results Advanced
          comment_title: 'My Custom Comment Title'
          check_run: 'false'
          job_summary: 'false'
          comment_mode: 'off'
          fail_on: 'nothing'
          action_fail: 'false'
          action_fail_on_inconclusive: 'false'
          compare_to_earlier_commit: 'false'
          test_changes_limit: '5'
          check_run_annotations_branch: 'main, master'
          report_individual_runs: 'true'
          deduplicate_classes_by_file_name: 'false'
          large_files: 'false'
          secondary_rate_limit_wait_seconds: '30'

      - name: Assert action ran with advanced options
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with advanced options"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
