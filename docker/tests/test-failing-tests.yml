name: Test with failing test results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture test results into workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/junit-failing.xml" "$GITHUB_WORKSPACE/junit-failing-results.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: junit-failing-results.xml
          check_name: 'Test Results - Failing'
          comment_mode: 'off'
          check_run: 'true'
          job_summary: 'true'
          fail_on: 'test failures'
          action_fail: 'true'

      - name: Assert action ran (failed due to test failures or sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          # The action should fail either because:
          # 1. Tests failed and action_fail=true, OR
          # 2. The sentinel repo caused a GitHub API failure
          # Either way, failure is the expected outcome here.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (test failures or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            # If it somehow succeeded, verify json output is present
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with json output"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
