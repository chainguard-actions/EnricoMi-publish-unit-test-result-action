name: Test with failing test results and action_fail enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture test results into workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/junit-failing.xml" "$GITHUB_WORKSPACE/junit-failing-results.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: junit-failing-results.xml
          check_name: 'Test Results (failing-tests)'
          comment_mode: 'off'
          check_run: 'true'
          job_summary: 'true'
          fail_on: 'test failures'
          action_fail: 'true'

      - name: Assert action failed (due to test failures or sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json: $JSON_OUT"
          # With action_fail=true and test failures present, the action should fail.
          # It may also fail due to the sentinel repo GitHub API call.
          # Either way, failure is the expected outcome here.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed as expected (test failures or sentinel repo)"
          elif [ "$OUTCOME" = "success" ]; then
            # If it somehow succeeded, verify JSON output is present and contains failure info
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "$JSON_OUT" | grep -q '"tests"' || { echo "FAIL: JSON missing 'tests' key"; exit 1; }
            echo "PASS: action succeeded with JSON output (check run may have been created)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
