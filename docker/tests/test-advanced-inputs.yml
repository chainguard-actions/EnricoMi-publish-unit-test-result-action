name: Test advanced inputs - commit, event_name, event_file, github_token_actor, docker_platform
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture test results into workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/junit-passing.xml" "$GITHUB_WORKSPACE/junit-results.xml"
          # Create a minimal event file for testing event_file input
          echo '{"action":"completed","workflow_run":{"event":"push","head_sha":"'"$GITHUB_SHA"'"}}' \
            > "$GITHUB_WORKSPACE/event.json"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: junit-results.xml
          check_name: 'Test Results - Advanced Inputs'
          comment_mode: 'off'
          check_run: 'true'
          job_summary: 'true'
          fail_on: 'nothing'
          action_fail: 'false'
          commit: ${{ github.sha }}
          event_name: 'push'
          event_file: event.json
          github_token_actor: 'github-actions[bot]'
          docker_platform: 'linux/amd64'

      - name: Assert action ran and produced output or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with json output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
