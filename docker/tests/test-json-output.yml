name: Test JSON output mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture test results into workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/junit-passing.xml" "$GITHUB_WORKSPACE/junit-results.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: junit-results.xml
          check_name: 'Test Results - JSON'
          comment_mode: 'off'
          check_run: 'true'
          job_summary: 'false'
          fail_on: 'nothing'
          action_fail: 'false'
          json_file: 'test-results.json'
          json_test_case_results: 'true'
          json_suite_details: 'false'

      - name: Assert action ran (succeeded or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output length: ${#JSON_OUT}"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with json output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Check JSON file was written (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ -f "$GITHUB_WORKSPACE/test-results.json" ]; then
              echo "PASS: JSON file was written"
              cat "$GITHUB_WORKSPACE/test-results.json" | head -20
            else
              echo "FAIL: JSON file was not written despite action success"
              exit 1
            fi
          else
            echo "PASS: skipping JSON file check since action failed gracefully"
          fi
