name: Test JSON file output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture test results into workspace
        run: |
          cp "$GITHUB_WORKSPACE/tests/fixtures/junit-passing.xml" "$GITHUB_WORKSPACE/junit-results.xml"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: junit-results.xml
          check_name: 'Test Results - JSON Output'
          comment_mode: 'off'
          check_run: 'true'
          job_summary: 'true'
          fail_on: 'nothing'
          action_fail: 'false'
          json_file: test-results.json
          json_suite_details: 'true'
          json_test_case_results: 'true'

      - name: Assert action ran and produced output or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with json output"
            # Check if json_file was written
            if [ -f "$GITHUB_WORKSPACE/test-results.json" ]; then
              echo "PASS: json_file was written"
              cat "$GITHUB_WORKSPACE/test-results.json"
            else
              echo "INFO: json_file not found at expected path (may be inside Docker container path)"
            fi
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
