name: Test deprecated file-type inputs and file processing options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Copy fixture test results into workspace
        run: |
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/junit-passing.xml" "$GITHUB_WORKSPACE/junit-type-results.xml"
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/nunit-passing.xml" "$GITHUB_WORKSPACE/nunit-type-results.xml"
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/xunit-passing.xml" "$GITHUB_WORKSPACE/xunit-type-results.xml"
          cp "$GITHUB_WORKSPACE/hardened/tests/fixtures/trx-passing.trx" "$GITHUB_WORKSPACE/trx-type-results.trx"

      - id: action
        uses: .
        continue-on-error: true
        with:
          junit_files: junit-type-results.xml
          nunit_files: nunit-type-results.xml
          xunit_files: xunit-type-results.xml
          trx_files: trx-type-results.trx
          check_name: 'Test Results (file-type-inputs)'
          comment_mode: 'off'
          check_run: 'false'
          job_summary: 'true'
          fail_on: 'nothing'
          action_fail: 'false'
          report_individual_runs: 'true'
          deduplicate_classes_by_file_name: 'true'
          large_files: 'false'
          test_file_prefix: '+.'

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "$JSON_OUT" | grep -q '"tests"' || { echo "FAIL: JSON missing 'tests' key"; exit 1; }
            echo "PASS: action succeeded with JSON output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
