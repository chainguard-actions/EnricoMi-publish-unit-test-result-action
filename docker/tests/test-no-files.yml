name: Test with no matching test files (inconclusive)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: nonexistent-test-results/*.xml
          check_name: 'Test Results (no-files)'
          comment_mode: 'off'
          check_run: 'true'
          job_summary: 'true'
          fail_on: 'test failures'
          action_fail: 'false'
          action_fail_on_inconclusive: 'false'

      - name: Assert action ran or failed gracefully when no test files found
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json: $JSON_OUT"
          # When no files are found, the action may succeed with empty results
          # or fail due to the sentinel repo GitHub API call.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with no test files (inconclusive result)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or no files found)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
