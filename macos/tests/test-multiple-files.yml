name: Test with multiple test result files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple JUnit XML test result files
        run: |
          mkdir -p tests/results/multi

          cat > tests/results/multi/suite-a.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="SuiteA" tests="2" failures="0" errors="0" skipped="0" time="0.300">
              <testcase name="test_a1" classname="SuiteA" time="0.100"/>
              <testcase name="test_a2" classname="SuiteA" time="0.200"/>
            </testsuite>
          </testsuites>
          EOF

          cat > tests/results/multi/suite-b.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="SuiteB" tests="2" failures="0" errors="0" skipped="1" time="0.400">
              <testcase name="test_b1" classname="SuiteB" time="0.400"/>
              <testcase name="test_b2" classname="SuiteB" time="0.000">
                <skipped/>
              </testcase>
            </testsuite>
          </testsuites>
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: |
            tests/results/multi/suite-a.xml
            tests/results/multi/suite-b.xml
          check_name: Test Results (Multiple)
          comment_mode: "off"
          check_run: "true"
          job_summary: "true"
          fail_on: "test failures"
          action_fail: "false"
          compare_to_earlier_commit: "false"
          report_individual_runs: "true"

      - name: Assert action ran with multiple files
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with multiple test files"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
