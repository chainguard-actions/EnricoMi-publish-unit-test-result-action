name: Test JSON output with detailed options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/junit-basic.xml
          check_name: 'Test Results JSON Detail'
          comment_mode: 'off'
          check_run: 'false'
          job_summary: 'false'
          compare_to_earlier_commit: 'false'
          json_file: /tmp/test-results-detail.json
          json_suite_details: 'true'
          json_test_case_results: 'true'

      - name: Assert action produced detailed JSON output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output length: ${#JSON_OUTPUT}"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUTPUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            # Verify JSON contains expected fields
            if ! echo "$JSON_OUTPUT" | grep -q '"tests"'; then
              echo "FAIL: JSON output does not contain 'tests' field"
              exit 1
            fi
            echo "PASS: action succeeded with detailed JSON output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Assert detailed JSON file was written (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -f /tmp/test-results-detail.json ]; then
              echo "FAIL: expected JSON file not found at /tmp/test-results-detail.json"
              exit 1
            fi
            echo "JSON file size: $(wc -c < /tmp/test-results-detail.json) bytes"
            echo "PASS: detailed JSON file exists"
          else
            echo "SKIP: action did not succeed, skipping JSON file check"
          fi
