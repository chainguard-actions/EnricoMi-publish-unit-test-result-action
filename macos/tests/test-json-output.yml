name: Test JSON file output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit XML test results
        run: |
          mkdir -p tests/results
          cat > tests/results/junit-json-test.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="JsonSuite" tests="2" failures="0" errors="0" skipped="1" time="0.500">
              <testcase name="test_alpha" classname="JsonSuite" time="0.300"/>
              <testcase name="test_beta" classname="JsonSuite" time="0.000">
                <skipped message="Not implemented yet"/>
              </testcase>
            </testsuite>
          </testsuites>
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/results/junit-json-test.xml
          check_name: Test Results (JSON)
          comment_mode: "off"
          check_run: "true"
          job_summary: "true"
          fail_on: "nothing"
          action_fail: "false"
          compare_to_earlier_commit: "false"
          json_file: tests/results/test-output.json
          json_suite_details: "true"
          json_test_case_results: "true"

      - name: Assert action ran and check JSON file
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            # Verify the JSON output file was created
            if [ -f "tests/results/test-output.json" ]; then
              echo "JSON file created successfully"
              # Verify it's valid JSON
              if python3 -c "import json, sys; json.load(open('tests/results/test-output.json'))" 2>/dev/null; then
                echo "PASS: JSON file is valid"
              else
                echo "FAIL: JSON file is not valid JSON"
                cat tests/results/test-output.json
                exit 1
              fi
            else
              echo "NOTE: JSON file not found (may be expected if API call failed)"
            fi
            echo "PASS: action succeeded with json output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
