name: Test extended input coverage
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Test with junit_files, nunit_files, xunit_files, trx_files and many other inputs
      - id: action
        uses: .
        continue-on-error: true
        with:
          # Deprecated file inputs (covered for input-coverage purposes)
          junit_files: tests/fixtures/junit-basic.xml
          nunit_files: tests/fixtures/nunit-basic.xml
          xunit_files: tests/fixtures/xunit-basic.xml
          trx_files: tests/fixtures/basic.trx
          # Deprecated actor input
          github_token_actor: ''
          # Comment and check run options
          comment_title: 'Extended Test Results'
          comment_mode: 'off'
          check_name: 'Extended Test Results'
          check_run: 'false'
          job_summary: 'false'
          # Commit override (use a placeholder; action will use GITHUB_SHA if invalid)
          commit: ${{ github.sha }}
          # Comparison and PR options
          compare_to_earlier_commit: 'false'
          # Annotation options
          check_run_annotations: 'all tests, skipped tests'
          check_run_annotations_branch: 'main, master, act-harness'
          test_changes_limit: '5'
          # File path prefix
          test_file_prefix: '+tests/'
          # Run options
          report_individual_runs: 'true'
          deduplicate_classes_by_file_name: 'false'
          large_files: 'false'
          # Rate limiting
          secondary_rate_limit_wait_seconds: '30'
          # Event override
          event_name: 'push'
          event_file: ''
          # JSON output
          json_file: /tmp/test-extended.json
          json_thousands_separator: ','

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUTPUT"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUTPUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            if ! echo "$JSON_OUTPUT" | grep -q '"tests"'; then
              echo "FAIL: JSON output does not contain 'tests' field"
              exit 1
            fi
            echo "PASS: action succeeded with JSON output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
