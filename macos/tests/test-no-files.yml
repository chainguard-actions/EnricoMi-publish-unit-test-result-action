name: Test with no matching test files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/nonexistent-*.xml
          check_name: 'Test Results No Files'
          comment_mode: 'off'
          check_run: 'true'
          job_summary: 'true'
          compare_to_earlier_commit: 'false'
          action_fail_on_inconclusive: 'false'

      - name: Assert action ran (no files is not a hard failure by default)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUTPUT"

          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with no matching files (inconclusive result)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo or no files found)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
