name: Test with no test files found
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/results/nonexistent-*.xml
          check_name: Test Results (No Files)
          comment_mode: "off"
          check_run: "true"
          job_summary: "true"
          fail_on: "nothing"
          action_fail: "false"
          action_fail_on_inconclusive: "false"
          compare_to_earlier_commit: "false"

      - name: Assert action ran (no files is inconclusive, not a hard failure)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          # With no files found and action_fail_on_inconclusive=false, action should succeed
          # But it may fail due to sentinel repo GitHub API calls
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with no test files (inconclusive result)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable or inconclusive)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
