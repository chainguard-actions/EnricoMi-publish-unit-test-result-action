name: Test extra inputs (part B) - event file and file prefix options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a fake event file
        run: |
          cat > /tmp/fake-event.json << 'EOF'
          {
            "action": "completed",
            "workflow_run": {
              "event": "push",
              "head_branch": "main",
              "head_sha": "abc123"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/junit-basic.xml
          check_name: 'Test Results Extra B'
          comment_mode: 'off'
          check_run: 'false'
          job_summary: 'false'
          compare_to_earlier_commit: 'false'
          # Event file override
          event_file: /tmp/fake-event.json
          event_name: 'workflow_run'
          # Test file prefix (strip a leading path component)
          test_file_prefix: '-/nonexistent'
          # Commit override (empty means use GITHUB_SHA)
          commit: ''
          # Deprecated actor input
          github_token_actor: ''
          # Deprecated file inputs (must appear in at least one test)
          junit_files: ''
          nunit_files: ''
          xunit_files: ''
          trx_files: ''
          # Other uncovered inputs
          deduplicate_classes_by_file_name: 'true'
          large_files: 'true'
          report_individual_runs: 'true'
          secondary_rate_limit_wait_seconds: '30'
          test_changes_limit: '0'
          check_run_annotations_branch: '*'
          comment_title: 'Extra B Comment Title'
          json_file: /tmp/test-results-extra-b.json

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUTPUT"

          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUTPUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            if ! echo "$JSON_OUTPUT" | grep -q '"tests"'; then
              echo "FAIL: JSON output does not contain 'tests' field"
              exit 1
            fi
            echo "PASS: action succeeded with JSON output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
