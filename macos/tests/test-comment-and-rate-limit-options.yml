name: Test comment title, rate limit, and event options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test fixture files
        run: |
          mkdir -p /tmp/test-results
          cat > /tmp/test-results/junit.xml <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="ExampleSuite" tests="1" failures="0" errors="0" time="0.5">
              <testcase name="test_one" classname="ExampleClass" time="0.5"/>
            </testsuite>
          </testsuites>
          EOF

          # Create a minimal event file for event_file input
          cat > /tmp/test-event.json <<'EOF'
          {
            "action": "completed",
            "workflow_run": {
              "event": "push"
            }
          }
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: /tmp/test-results/junit.xml
          comment_title: 'My Custom Test Results Title'
          test_changes_limit: '5'
          check_run_annotations_branch: 'main, master, act-harness'
          secondary_rate_limit_wait_seconds: '30'
          event_file: /tmp/test-event.json
          event_name: 'push'
          check_run: 'false'
          job_summary: 'true'
          comment_mode: 'off'
          fail_on: 'nothing'
          action_fail: 'false'

      - name: Assert action ran (success or graceful failure on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json: $JSON"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with json output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
