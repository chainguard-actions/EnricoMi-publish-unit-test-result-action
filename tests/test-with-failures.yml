name: Test publishing results with test failures
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit test result file with failures
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          cat > "$GITHUB_WORKSPACE/test-results/junit-failures.xml" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="Test Suite" tests="4" failures="2" errors="1" time="2.0">
            <testsuite name="com.example.TestClass" tests="4" failures="2" errors="1" time="2.0">
              <testcase name="testPass" classname="com.example.TestClass" time="0.5"/>
              <testcase name="testFail1" classname="com.example.TestClass" time="0.5">
                <failure message="AssertionError" type="AssertionError">Expected true but was false</failure>
              </testcase>
              <testcase name="testFail2" classname="com.example.TestClass" time="0.5">
                <failure message="NullPointerException" type="NullPointerException">Null pointer at line 42</failure>
              </testcase>
              <testcase name="testError" classname="com.example.TestClass" time="0.5">
                <error message="RuntimeException" type="RuntimeException">Unexpected error</error>
              </testcase>
            </testsuite>
          </testsuites>
          EOF

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: test-results/junit-failures.xml
          check_name: 'Test Results With Failures'
          comment_mode: 'off'
          check_run: 'true'
          job_summary: 'true'
          fail_on: 'nothing'
          action_fail: 'false'
          action_fail_on_inconclusive: 'false'

      - name: Assert action ran and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with json output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
