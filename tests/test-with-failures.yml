name: Test with failing tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit XML with failures
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          cat > "$GITHUB_WORKSPACE/test-results/junit-failures.xml" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="Test Suite" tests="3" failures="1" errors="1" time="2.0">
            <testsuite name="ExampleTests" tests="3" failures="1" errors="1" time="2.0">
              <testcase name="test_pass" classname="ExampleTests" time="0.5"/>
              <testcase name="test_fail" classname="ExampleTests" time="0.5">
                <failure message="AssertionError">Expected true but got false</failure>
              </testcase>
              <testcase name="test_error" classname="ExampleTests" time="0.5">
                <error message="RuntimeError">Unexpected exception occurred</error>
              </testcase>
            </testsuite>
          </testsuites>
          EOF

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: test-results/junit-failures.xml
          check_name: 'Test Results With Failures'
          comment_mode: 'off'
          check_run: 'true'
          job_summary: 'true'
          fail_on: 'nothing'
          action_fail: 'false'

      - name: Assert action ran or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            # Verify the JSON contains failure counts
            echo "$JSON_OUT" | grep -q '"failed"' || {
              echo "FAIL: JSON output does not contain 'failed' field"
              exit 1
            }
            echo "PASS: action succeeded with JSON output containing failure info"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
