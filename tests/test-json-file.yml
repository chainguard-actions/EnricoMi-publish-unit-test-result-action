name: Test json_file output with check_run disabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/junit-fail.xml
          check_run: 'false'
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
          json_file: test-results.json
          json_test_case_results: 'true'
      - name: Assert json file written (or graceful failure on sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.json }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -s "$GITHUB_WORKSPACE/test-results.json" ]; then
              echo "FAIL: json_file not written"
              exit 1
            fi
            cat "$GITHUB_WORKSPACE/test-results.json"
            if ! grep -q '"conclusion": *"failure"' "$GITHUB_WORKSPACE/test-results.json"; then
              echo "FAIL: expected conclusion failure"
              exit 1
            fi
            if ! grep -q 'test_broken' "$GITHUB_WORKSPACE/test-results.json"; then
              echo "FAIL: expected test case results to include test_broken"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
