name: Test advanced options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit XML test result file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          cat > "$GITHUB_WORKSPACE/test-results/junit.xml" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="Suite" tests="3" failures="0" errors="0" time="1.5">
            <testsuite name="AdvancedTests" tests="3" failures="0" errors="0" time="1.5">
              <testcase name="test_alpha" classname="AdvancedTests" time="0.5"/>
              <testcase name="test_beta" classname="AdvancedTests" time="0.5"/>
              <testcase name="test_gamma" classname="AdvancedTests" time="0.5"/>
            </testsuite>
          </testsuites>
          EOF

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Get current commit SHA
        id: get-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: test-results/junit.xml
          commit: ${{ steps.get-sha.outputs.sha }}
          check_name: 'Test Results Advanced Options'
          comment_title: 'My Custom Comment Title'
          comment_mode: 'off'
          check_run: 'false'
          job_summary: 'false'
          fail_on: 'nothing'
          action_fail: 'false'
          large_files: 'false'
          report_individual_runs: 'true'
          test_changes_limit: '5'
          secondary_rate_limit_wait_seconds: '60'

      - name: Assert action ran or failed gracefully on sentinel repo
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with JSON output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable via GitHub API)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
