name: Test event and commit options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit test result file and event file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          cat > "$GITHUB_WORKSPACE/test-results/junit.xml" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="Test Suite" tests="2" failures="0" errors="0" time="1.0">
            <testsuite name="com.example.EventTest" tests="2" failures="0" errors="0" time="1.0">
              <testcase name="testOne" classname="com.example.EventTest" time="0.5"/>
              <testcase name="testTwo" classname="com.example.EventTest" time="0.5"/>
            </testsuite>
          </testsuites>
          EOF
          # Create a minimal event file simulating a push event
          cat > "$GITHUB_WORKSPACE/test-results/event.json" << 'EOF'
          {
            "action": "push",
            "repository": {
              "default_branch": "main"
            }
          }
          EOF
          # Get the current commit SHA
          echo "CURRENT_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: test-results/junit.xml
          check_name: 'Test Results Event Options'
          comment_mode: 'off'
          check_run: 'true'
          job_summary: 'true'
          fail_on: 'nothing'
          action_fail: 'false'
          event_file: test-results/event.json
          event_name: 'push'
          commit: ${{ env.CURRENT_SHA }}

      - name: Assert action ran and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with json output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
