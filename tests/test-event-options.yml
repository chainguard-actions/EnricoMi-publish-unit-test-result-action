name: Test event and commit options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit test result file and event file
        run: |
          mkdir -p /tmp/test-results
          cat > /tmp/test-results/results.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="EventSuite" tests="1" failures="0" errors="0" time="0.5">
              <testcase name="test_event" classname="EventSuite" time="0.5"/>
            </testsuite>
          </testsuites>
          EOF

          # Create a minimal event file simulating a push event
          cat > /tmp/event.json << 'EOF'
          {
            "action": "push",
            "repository": {
              "default_branch": "main"
            }
          }
          EOF

      - name: Get current commit SHA
        id: get-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: /tmp/test-results/results.xml
          commit: ${{ steps.get-sha.outputs.sha }}
          event_file: /tmp/event.json
          event_name: push
          secondary_rate_limit_wait_seconds: '30'
          check_run: 'true'
          job_summary: 'true'

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json: $JSON"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with json output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
