name: Test JSON file output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create JUnit XML test result file
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          cat > "$GITHUB_WORKSPACE/test-results/results.xml" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="MySuite" tests="2" failures="0" errors="0" time="1.0">
              <testcase name="test_alpha" classname="MySuite" time="0.4"/>
              <testcase name="test_beta" classname="MySuite" time="0.6"/>
            </testsuite>
          </testsuites>
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: test-results/*.xml
          check_run: 'false'
          job_summary: 'true'
          comment_mode: 'off'
          fail_on: 'nothing'
          action_fail: 'false'
          json_file: test-results/output.json
          json_suite_details: 'true'
          json_test_case_results: 'true'

      - name: Assert action ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with JSON output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi

      - name: Check JSON file was written (if action succeeded)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            if [ ! -f "$GITHUB_WORKSPACE/test-results/output.json" ]; then
              echo "FAIL: expected JSON file not found at test-results/output.json"
              exit 1
            fi
            echo "JSON file contents:"
            cat "$GITHUB_WORKSPACE/test-results/output.json"
            echo "PASS: JSON file exists"
          else
            echo "SKIP: action did not succeed (sentinel repo), skipping file check"
          fi
