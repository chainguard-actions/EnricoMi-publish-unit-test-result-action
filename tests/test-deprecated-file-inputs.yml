name: Test deprecated file inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          junit_files: tests/fixtures/junit-pass.xml
          nunit_files: tests/fixtures/does-not-exist-nunit-*.xml
          xunit_files: tests/fixtures/does-not-exist-xunit-*.xml
          trx_files: tests/fixtures/does-not-exist-*.trx
          github_token_actor: github-actions
          check_run: 'false'
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
      - name: Assert action ran (json output, or graceful failure on sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.json }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            if ! echo "$RESULT" | grep -q '"tests": *3'; then
              echo "FAIL: expected 3 tests from junit_files"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
