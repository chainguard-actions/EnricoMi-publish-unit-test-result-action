name: Test action_fail with failing tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/junit-fail.xml
          action_fail: 'true'
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
      - name: Assert action step failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure with action_fail=true and failing tests"
            exit 1
          fi
          echo "PASS"
