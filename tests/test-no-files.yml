name: Test with no matching test files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: nonexistent-dir/no-results-*.xml
          check_name: 'Test Results - No Files'
          comment_mode: 'off'
          check_run: 'false'
          job_summary: 'true'
          fail_on: 'nothing'
          action_fail: 'false'
          action_fail_on_inconclusive: 'false'

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUTPUT"
          # When no files are found, the action may succeed (reporting 0 tests) or fail
          # on the sentinel repo due to GitHub API calls. Both are acceptable.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (reported 0 tests or skipped check run creation)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no files found or sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
