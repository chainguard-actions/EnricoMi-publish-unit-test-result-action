name: Test glob pattern file matching
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create multiple JUnit test result files
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results/module-a"
          mkdir -p "$GITHUB_WORKSPACE/test-results/module-b"

          cat > "$GITHUB_WORKSPACE/test-results/module-a/junit.xml" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="Module A" tests="2" failures="0" errors="0" time="1.0">
            <testsuite name="com.example.ModuleA" tests="2" failures="0" errors="0" time="1.0">
              <testcase name="testA1" classname="com.example.ModuleA" time="0.5"/>
              <testcase name="testA2" classname="com.example.ModuleA" time="0.5"/>
            </testsuite>
          </testsuites>
          EOF

          cat > "$GITHUB_WORKSPACE/test-results/module-b/junit.xml" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="Module B" tests="3" failures="0" errors="0" time="1.5">
            <testsuite name="com.example.ModuleB" tests="3" failures="0" errors="0" time="1.5">
              <testcase name="testB1" classname="com.example.ModuleB" time="0.5"/>
              <testcase name="testB2" classname="com.example.ModuleB" time="0.5"/>
              <testcase name="testB3" classname="com.example.ModuleB" time="0.5"/>
            </testsuite>
          </testsuites>
          EOF

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: |
            test-results/**/*.xml
          check_name: 'Test Results Glob'
          comment_mode: 'off'
          check_run: 'true'
          job_summary: 'true'
          fail_on: 'nothing'
          action_fail: 'false'

      - name: Assert action ran and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with json output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
