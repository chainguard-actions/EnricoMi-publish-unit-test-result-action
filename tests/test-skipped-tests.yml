name: Test publishing results with skipped tests
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit test result file with skipped tests
        run: |
          mkdir -p "$GITHUB_WORKSPACE/test-results"
          cat > "$GITHUB_WORKSPACE/test-results/junit-skipped.xml" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites name="Test Suite" tests="5" failures="0" errors="0" skipped="2" time="2.5">
            <testsuite name="com.example.SkipTest" tests="5" failures="0" errors="0" skipped="2" time="2.5">
              <testcase name="testRunning1" classname="com.example.SkipTest" time="0.5"/>
              <testcase name="testRunning2" classname="com.example.SkipTest" time="0.5"/>
              <testcase name="testRunning3" classname="com.example.SkipTest" time="0.5"/>
              <testcase name="testSkipped1" classname="com.example.SkipTest" time="0.0">
                <skipped message="Not implemented yet"/>
              </testcase>
              <testcase name="testSkipped2" classname="com.example.SkipTest" time="0.0">
                <skipped message="Requires external service"/>
              </testcase>
            </testsuite>
          </testsuites>
          EOF

      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: test-results/junit-skipped.xml
          check_name: 'Test Results Skipped'
          comment_mode: 'off'
          check_run: 'true'
          job_summary: 'true'
          fail_on: 'nothing'
          action_fail: 'false'
          report_individual_runs: 'true'
          check_run_annotations: 'all tests, skipped tests'

      - name: Assert action ran and produced output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with json output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
