name: Test reporting options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/junit-fail.xml
          commit: ${{ steps.sha.outputs.sha }}
          comment_title: Custom Test Comment Title
          check_run_annotations_branch: '*'
          deduplicate_classes_by_file_name: 'true'
          large_files: 'true'
          report_individual_runs: 'true'
          secondary_rate_limit_wait_seconds: '5'
          test_changes_limit: '3'
          test_file_prefix: '+src/'
          check_run: 'false'
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
      - name: Assert action ran (json output, or graceful failure on sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.json }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            if ! echo "$RESULT" | grep -q '"conclusion": *"failure"'; then
              echo "FAIL: expected conclusion failure"
              exit 1
            fi
            echo "PASS"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
