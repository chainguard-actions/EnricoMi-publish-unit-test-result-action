name: Test with no matching test files
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: nonexistent-test-results-*.xml
          check_name: 'Test Results (No Files)'
          comment_mode: 'off'
          check_run: 'true'
          job_summary: 'true'
          fail_on: 'nothing'
          action_fail: 'false'
          action_fail_on_inconclusive: 'false'

      - name: Assert action ran gracefully with no files
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUTPUT"
          # With no files, the action may succeed (reporting 0 tests) or fail due to API issues
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded gracefully with no test files"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (no files or sentinel repo not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
