name: Test file processing options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit XML test result files with duplicate class names
        run: |
          mkdir -p /tmp/test-results/suite1
          mkdir -p /tmp/test-results/suite2

          cat > /tmp/test-results/suite1/results.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="Suite" tests="2" failures="0" errors="0" skipped="0" time="1.0">
              <testcase name="test_one" classname="CommonClass" time="0.5" file="src/test_one.py"/>
              <testcase name="test_two" classname="CommonClass" time="0.5" file="src/test_two.py"/>
            </testsuite>
          </testsuites>
          EOF

          cat > /tmp/test-results/suite2/results.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="Suite" tests="2" failures="0" errors="0" skipped="0" time="1.0">
              <testcase name="test_three" classname="CommonClass" time="0.5" file="src/test_three.py"/>
              <testcase name="test_four" classname="CommonClass" time="0.5" file="src/test_four.py"/>
            </testsuite>
          </testsuites>
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: /tmp/test-results/**/*.xml
          deduplicate_classes_by_file_name: 'true'
          large_files: 'false'
          test_file_prefix: '+/tmp/'
          check_run: 'false'
          job_summary: 'true'
          comment_mode: 'off'
          fail_on: 'nothing'
          compare_to_earlier_commit: 'false'

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with file processing options"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
