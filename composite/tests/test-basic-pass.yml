name: Test basic passing JUnit results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/junit-pass.xml
          check_run: 'false'
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
          json_file: ${{ runner.temp }}/results-pass.json
      - name: Assert action ran (results published, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.json }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            TESTS=$(echo "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["stats"]["tests"])')
            FAILS=$(echo "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["stats"]["tests_fail"])')
            CONCL=$(echo "$RESULT" | python3 -c 'import json,sys; print(json.load(sys.stdin)["conclusion"])')
            echo "tests=$TESTS fails=$FAILS conclusion=$CONCL"
            if [ "$TESTS" != "3" ] || [ "$FAILS" != "0" ] || [ "$CONCL" != "success" ]; then
              echo "FAIL: unexpected stats"
              exit 1
            fi
            echo "PASS: got expected results"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
