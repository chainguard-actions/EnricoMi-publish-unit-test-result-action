name: Test comment options inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create test fixture
        run: |
          mkdir -p /tmp/test-results
          cat > /tmp/test-results/results.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="example" tests="2" failures="0" errors="0" time="1.0">
              <testcase name="test_one" classname="ExampleTest" time="0.5"/>
              <testcase name="test_two" classname="ExampleTest" time="0.5"/>
            </testsuite>
          </testsuites>
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          github_token_actor: octocat
          files: /tmp/test-results/results.xml
          comment_title: "My Custom Comment Title"
          test_changes_limit: 5
          check_run_annotations_branch: "main, master, act-harness"
          check_run: "false"
          job_summary: "true"
          compare_to_earlier_commit: "false"
          comment_mode: "off"

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json: $JSON"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with json output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
