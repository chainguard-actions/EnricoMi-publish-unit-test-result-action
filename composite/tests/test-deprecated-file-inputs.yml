name: Test deprecated file inputs and related options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit test fixture
        run: |
          mkdir -p /tmp/junit-results
          cat > /tmp/junit-results/junit.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="junit-suite" tests="2" failures="0" errors="0" time="1.0">
              <testcase name="test_alpha" classname="JUnitTest" time="0.5"/>
              <testcase name="test_beta" classname="JUnitTest" time="0.5"/>
            </testsuite>
          </testsuites>
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          github_token: ${{ github.token }}
          junit_files: /tmp/junit-results/junit.xml
          nunit_files: ""
          xunit_files: ""
          trx_files: ""
          report_individual_runs: "true"
          large_files: "false"
          check_run: "false"
          job_summary: "true"
          compare_to_earlier_commit: "false"
          comment_mode: "off"

      - name: Assert action ran (outputs set, or failed gracefully on the sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json: $JSON"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with json output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
