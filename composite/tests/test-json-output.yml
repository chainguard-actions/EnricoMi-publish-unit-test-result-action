name: Test JSON file output
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit XML test result file with mixed results
        run: |
          mkdir -p test-results
          cat > test-results/junit.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="MySuite" tests="4" failures="1" errors="0" skipped="1" time="2.5">
              <testcase name="test_pass_one" classname="MySuite" time="0.5"/>
              <testcase name="test_pass_two" classname="MySuite" time="0.5"/>
              <testcase name="test_skip" classname="MySuite" time="0.0">
                <skipped message="skipped for now"/>
              </testcase>
              <testcase name="test_fail" classname="MySuite" time="1.0">
                <failure message="assertion failed">Expected 1 but got 2</failure>
              </testcase>
            </testsuite>
          </testsuites>
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: test-results/junit.xml
          check_run: 'false'
          job_summary: 'false'
          comment_mode: 'off'
          fail_on: 'nothing'
          action_fail: 'false'
          compare_to_earlier_commit: 'false'
          json_file: test-results/output.json
          json_test_case_results: 'true'

      - name: Assert action ran and JSON file was written or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUTPUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json output: $JSON_OUTPUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUTPUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            # Verify the JSON file was written
            if [ ! -f "test-results/output.json" ]; then
              echo "FAIL: json_file was not written"
              exit 1
            fi
            echo "JSON file contents:"
            cat test-results/output.json
            echo "PASS: action succeeded with JSON output and file"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
