name: Test advanced reporting options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          files: tests/fixtures/junit-pass.xml
          commit: ${{ github.sha }}
          comment_title: 'Custom Unit Test Title'
          check_run_annotations_branch: '*'
          deduplicate_classes_by_file_name: 'true'
          event_file: ${{ github.event_path }}
          event_name: workflow_dispatch
          large_files: 'true'
          report_individual_runs: 'true'
          secondary_rate_limit_wait_seconds: '5'
          test_changes_limit: '5'
          test_file_prefix: '+src/'
          check_run: 'false'
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
      - name: Assert action ran (results published, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.json }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            OUT=$(echo "$RESULT" | python3 -c 'import json,sys; d=json.load(sys.stdin); s=d["stats"]; print(s["tests"], s["tests_fail"], d["conclusion"])')
            echo "stats: $OUT"
            if [ "$OUT" != "3 0 success" ]; then
              echo "FAIL: expected '3 0 success'"
              exit 1
            fi
            echo "PASS: advanced options accepted and results published"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
