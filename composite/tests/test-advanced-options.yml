name: Test advanced options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit XML test result file
        run: |
          mkdir -p /tmp/test-results
          cat > /tmp/test-results/results.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="AdvancedSuite" tests="2" failures="0" errors="0" skipped="1" time="1.0">
              <testcase name="test_pass" classname="AdvancedSuite" time="0.5"/>
              <testcase name="test_skip" classname="AdvancedSuite" time="0.0">
                <skipped/>
              </testcase>
            </testsuite>
          </testsuites>
          EOF

          # Create a minimal event file
          cat > /tmp/event.json << 'EOF'
          {"action": "push"}
          EOF

      - name: Get current commit SHA
        id: git-info
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: /tmp/test-results/results.xml
          commit: ${{ steps.git-info.outputs.sha }}
          event_file: /tmp/event.json
          event_name: push
          test_changes_limit: '5'
          check_run_annotations_branch: 'main, master, act-harness'
          secondary_rate_limit_wait_seconds: '30'
          check_run: 'false'
          job_summary: 'true'
          comment_mode: 'off'
          fail_on: 'nothing'
          compare_to_earlier_commit: 'false'

      - name: Assert action ran or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with advanced options"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
