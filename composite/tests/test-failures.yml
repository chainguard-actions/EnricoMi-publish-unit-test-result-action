name: Test JUnit results with failures and errors
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          files: |
            tests/fixtures/*.xml
            !tests/fixtures/junit-pass.xml
          check_run: 'false'
          comment_mode: 'off'
          compare_to_earlier_commit: 'false'
          json_test_case_results: 'true'
      - name: Assert action ran (failures reported, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.json }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "result: $RESULT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$RESULT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            OUT=$(echo "$RESULT" | python3 -c 'import json,sys; d=json.load(sys.stdin); s=d["stats"]; print(s["tests"], s["tests_fail"], s["tests_error"], s["tests_skip"], d["conclusion"])')
            echo "stats: $OUT"
            if [ "$OUT" != "4 1 1 1 failure" ]; then
              echo "FAIL: expected '4 1 1 1 failure'"
              exit 1
            fi
            echo "PASS: failures reported correctly"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
