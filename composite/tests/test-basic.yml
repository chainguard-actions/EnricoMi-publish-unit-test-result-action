name: Test basic usage with JUnit XML results
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create JUnit XML test result file
        run: |
          mkdir -p /tmp/test-results
          cat > /tmp/test-results/results.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <testsuites>
            <testsuite name="ExampleSuite" tests="3" failures="0" errors="0" skipped="0" time="1.5">
              <testcase name="test_one" classname="ExampleSuite" time="0.5"/>
              <testcase name="test_two" classname="ExampleSuite" time="0.5"/>
              <testcase name="test_three" classname="ExampleSuite" time="0.5"/>
            </testsuite>
          </testsuites>
          EOF

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: /tmp/test-results/results.xml
          check_run: 'false'
          job_summary: 'true'
          comment_mode: 'off'
          fail_on: 'nothing'
          compare_to_earlier_commit: 'false'

      - name: Assert action ran and produced JSON output or failed gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
          JSON_OUT: ${{ steps.action.outputs.json }}
        run: |
          echo "outcome: $OUTCOME"
          echo "json: $JSON_OUT"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$JSON_OUT" ]; then
              echo "FAIL: action succeeded but json output is empty"
              exit 1
            fi
            echo "PASS: action succeeded with JSON output"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
